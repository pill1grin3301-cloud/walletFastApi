# Список сервисов (контейнеров)
services:
  # Первый сервис: база данных
  db:
    container_name: wallet_db
    restart: unless-stopped
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg_data_wallet:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 12s
      retries: 4

  test_db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    ports:
      - "5434:5432"

  app:
    container_name: app_wallet
    restart: unless-stopped
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    env_file:
      - .env

  bot:
    build: .
    container_name: wallet_bot
    restart: unless-stopped
    command: python -m bot.main
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    container_name: wallet_frontend
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - app

volumes:
  pg_data_wallet:
